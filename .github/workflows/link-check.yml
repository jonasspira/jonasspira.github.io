name: Link check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Check every page and Markdown file in the repo for broken links.
          # --root-dir: links starting with "/" (like /filters/) start at the
          #   top of the repo, as they do on www.spiiira.com.
          # --exclude '%7B%7B': skip links containing "{{". Those are Jekyll
          #   placeholders (toronto26) that only become real paths when
          #   GitHub Pages builds the site.
          # --exclude 'goatcounter\.com/count': the visit counter's address in
          #   every page. It only accepts visits from the counter script, so a
          #   plain check of it always fails.
          args: --verbose --no-progress --root-dir '${{ github.workspace }}' --exclude '%7B%7B' --exclude 'goatcounter\.com/count' './**/*.md' './**/*.html'
