const CLIENT_ID = "994773724656-dht15sn4cq190nr2v9sgmn0ki5nqj86p.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/userinfo.email";

const quoteIfNeeded = (val) => {
  const t = (val || "").trim();
  if (!t) return "";
  if (/\s/.test(t) && !(t.startsWith('"') && t.endsWith('"'))) return `"${t}"`;
  return t;
};
const splitList = (val) => val.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
const now = new Date();
const revDate = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;

// Extract root domain from a from-field string (e.g. "no-reply@accounts.google.com" -> "google.com")
const extractDomain = (fromStr) => {
  if (!fromStr) return null;
  const atMatches = fromStr.match(/@([\w.-]+\.[a-z]{2,})/gi);
  if (atMatches && atMatches.length) {
    const raw = atMatches[0].replace('@', '').toLowerCase();
    const parts = raw.split('.');
    return parts.length >= 2 ? parts.slice(-2).join('.') : raw;
  }
  const bareMatches = fromStr.match(/\b([\w-]+\.[a-z]{2,})\b/gi);
  if (bareMatches && bareMatches.length) {
    const raw = bareMatches[0].toLowerCase();
    const parts = raw.split('.');
    return parts.length >= 2 ? parts.slice(-2).join('.') : raw;
  }
  return null;
};

// Suggest a human label from a domain ("atlassian.net" -> "Atlassian", "loom.com" -> "Loom")
const domainToLabel = (domain) => {
  if (!domain) return domain;
  const name = domain.split('.')[0];
  return name.charAt(0).toUpperCase() + name.slice(1);
};

function useViewport() {
  const [width, setWidth] = useState(window.innerWidth);
  useEffect(() => {
    const handler = () => setWidth(window.innerWidth);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  const isMobile = width < 600;
  const isWide = width >= 900;
  return { width, isMobile, isWide };
}

// ── OAUTH ─────────────────────────────────────────────────────────────────────
function useGoogleAuth() {
  const [token, setToken] = useState(null);
  const [userEmail, setUserEmail] = useState("");
  const [loading, setLoading] = useState(false);
  const [filterCount, setFilterCount] = useState(0);
  const [filtersRaw, setFiltersRaw] = useState(null);
  const clientRef = useRef(null);

  useEffect(() => {
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.onload = () => {
      clientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) { setLoading(false); return; }
          setToken(resp.access_token);
          setLoading(false);
          try {
            const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
              headers: { Authorization: `Bearer ${resp.access_token}` }
            });
            const d = await r.json();
            setUserEmail(d.email || "");
          } catch {}
          await fetchFilters(resp.access_token);
        },
      });
    };
    document.head.appendChild(script);
  }, []);

  const fetchFilters = async (tok) => {
    try {
      const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/settings/filters', {
        headers: { Authorization: `Bearer ${tok}` }
      });
      const d = await r.json();
      const filters = d.filter || [];
      setFilterCount(filters.length);
      setFiltersRaw(filters);
    } catch (e) {
      console.error('Filter fetch error:', e);
    }
  };

  const signIn = () => { setLoading(true); clientRef.current?.requestAccessToken(); };
  const signOut = () => {
    if (token) window.google?.accounts.oauth2.revoke(token);
    setToken(null); setUserEmail(""); setFilterCount(0); setFiltersRaw(null);
  };
  const refresh = async () => { if (token) await fetchFilters(token); };

  return { token, userEmail, loading, filterCount, filtersRaw, signIn, signOut, refresh };
}

// ── BUILD TAB ─────────────────────────────────────────────────────────────────
const FIELDS = [
  { id: "from", label: "From", hint: "Sender email or domain" },
  { id: "subject", label: "Subject", hint: "Words in subject line" },
  { id: "to", label: "To / Cc", hint: "Recipient address" },
  { id: "hasWords", label: "Has words", hint: "Free-form text in message" },
  { id: "doesntHave", label: "Exclude", hint: "Words to exclude" },
  { id: "hasAttachment", label: "Attachment", hint: "Only with files attached" },
  { id: "list", label: "Mailing list", hint: "List-ID for newsletters" },
  { id: "size", label: "Size", hint: "Larger or smaller than" },
];

function BuildTab({ isMobile, isWide }) {
  const [step, setStep] = useState(1);
  const [selected, setSelected] = useState([]);
  const [vals, setVals] = useState({});
  const [modes, setModes] = useState({ from: "OR", subject: "OR", to: "OR" });
  const [copied, setCopied] = useState(false);
  const [toast, setToast] = useState("");
  const step2Ref = useRef(null);
  const step3Ref = useRef(null);

  const toggleField = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const setVal = (id, v) => setVals(o => ({ ...o, [id]: v }));
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 1800); };

  const query = useMemo(() => {
    const parts = [];
    const build = (op, raw, mode) => {
      const list = splitList(raw || "");
      if (!list.length) return "";
      if (mode === "OR" && list.length > 1) return `{${list.map(i => `${op}:${quoteIfNeeded(i)}`).join(" ")}}`;
      return list.map(i => `${op}:${quoteIfNeeded(i)}`).join(" ");
    };
    if (selected.includes("from")) { const v = build("from", vals.from, modes.from); if (v) parts.push(v); }
    if (selected.includes("subject")) { const v = build("subject", vals.subject, modes.subject); if (v) parts.push(v); }
    if (selected.includes("to")) { const v = build("to", vals.to, modes.to); if (v) parts.push(v); }
    if (selected.includes("hasWords") && (vals.hasWords||"").trim()) parts.push(`(${vals.hasWords.trim()})`);
    if (selected.includes("doesntHave") && (vals.doesntHave||"").trim()) vals.doesntHave.trim().split(/\s+/).forEach(t => parts.push(`-${quoteIfNeeded(t)}`));
    if (selected.includes("hasAttachment")) parts.push("has:attachment");
    if (selected.includes("list") && (vals.list||"").trim()) parts.push(`list:${quoteIfNeeded(vals.list.trim())}`);
    if (selected.includes("size") && vals.sizeOp && vals.sizeVal) parts.push(`${vals.sizeOp}:${vals.sizeVal}${vals.sizeUnit||"M"}`);
    return parts.join(" ");
  }, [selected, vals, modes]);

  const copy = () => { navigator.clipboard.writeText(query); setCopied(true); showToast("Copied"); setTimeout(() => setCopied(false), 1800); };
  const reset = () => { setStep(1); setSelected([]); setVals({}); setModes({ from: "OR", subject: "OR", to: "OR" }); };
  const goStep = (n, ref) => { setStep(n); setTimeout(() => ref?.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); };
  const stepState = (n) => n === step ? 'active' : n < step ? 'complete' : 'locked';
  const ModeToggle = ({ field }) => h("span", { style: S.modeWrap },
    h("button", { style: S.modeBtn(modes[field] === "OR"), onClick: () => setModes(m => ({ ...m, [field]: "OR" })) }, "Any"),
    h("button", { style: S.modeBtn(modes[field] === "AND"), onClick: () => setModes(m => ({ ...m, [field]: "AND" })) }, "All"),
  );

  return h("div", null,
    h("div", { style: S.statRow },
      h("div", { style: S.statCell }, h("div", { style: S.statNum }, selected.length), h("div", { style: S.statLabel }, "Fields")),
      h("div", { style: S.statDivider }),
      h("div", { style: S.statCell }, h("div", { style: S.statNum }, query.length), h("div", { style: S.statLabel }, "Chars")),
      h("div", { style: S.statDivider }),
      h("div", { style: S.statCell }, h("div", { style: S.statNum }, step), h("div", { style: S.statLabel }, "Step")),
    ),
    h("div", { style: S.stepBlock(stepState(1)), onClick: () => step > 1 && setStep(1) },
      h("div", { style: S.stepBadge(stepState(1)) }, "1"),
      h("div", { style: S.stepLabel }, "Select fields"),
      stepState(1) === 'complete' && h("div", { style: S.stepSummary }, `${selected.length} field${selected.length !== 1 ? 's' : ''} selected`),
      stepState(1) === 'active' && h("div", null,
        h("div", { style: S.chipGrid(isWide) },
          ...FIELDS.map(f => h("button", {
            key: f.id, style: S.chip(selected.includes(f.id)),
            onClick: () => toggleField(f.id),
            onMouseDown: e => e.currentTarget.style.transform = 'scale(0.97)',
            onMouseUp: e => e.currentTarget.style.transform = 'scale(1)',
            onMouseLeave: e => e.currentTarget.style.transform = 'scale(1)',
          },
            h("div", { style: S.chipLabel(selected.includes(f.id)) }, f.label),
            h("div", { style: S.chipHint(selected.includes(f.id)) }, f.hint),
          ))
        ),
        h("button", { style: selected.length ? S.btnPrimary : S.btnPrimaryDisabled, onClick: () => selected.length && goStep(2, step2Ref), disabled: !selected.length }, "Next"),
      ),
    ),
    h("div", { ref: step2Ref, style: S.stepBlock(stepState(2)), onClick: () => step === 3 && setStep(2) },
      h("div", { style: S.stepBadge(stepState(2)) }, "2"),
      h("div", { style: S.stepLabel }, "Enter values"),
      stepState(2) === 'complete' && h("div", { style: S.stepSummary }, query.length ? `${query.length} char query` : "—"),
      stepState(2) === 'active' && h("div", null,
        selected.includes("from") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, h("span", null, "From"), h(ModeToggle, { field: "from" })),
          h("textarea", { style: { ...S.textarea, minHeight: 50 }, value: vals.from||"", onChange: e => setVal("from", e.target.value), placeholder: "newsletter@example.com, *@atlassian.com" }),
          h("div", { style: S.hint }, "Comma or newline separated"),
        ),
        selected.includes("subject") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, h("span", null, "Subject"), h(ModeToggle, { field: "subject" })),
          h("textarea", { style: { ...S.textarea, minHeight: 50 }, value: vals.subject||"", onChange: e => setVal("subject", e.target.value), placeholder: "invoice, receipt, order confirmation" }),
          h("div", { style: S.hint }, "Multi-word phrases auto-quoted"),
        ),
        selected.includes("to") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, h("span", null, "To / Cc"), h(ModeToggle, { field: "to" })),
          h("input", { style: S.input, value: vals.to||"", onChange: e => setVal("to", e.target.value), placeholder: "me@gmail.com, alias@gmail.com" }),
        ),
        selected.includes("hasWords") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, "Has words"),
          h("input", { style: S.input, value: vals.hasWords||"", onChange: e => setVal("hasWords", e.target.value), placeholder: 'unsubscribe OR "view in browser"' }),
          h("div", { style: S.hint }, "Use OR (uppercase) for alternatives"),
        ),
        selected.includes("doesntHave") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, "Exclude"),
          h("input", { style: S.input, value: vals.doesntHave||"", onChange: e => setVal("doesntHave", e.target.value), placeholder: "spam promo" }),
          h("div", { style: S.hint }, "Each word becomes a -word exclusion"),
        ),
        selected.includes("hasAttachment") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, "Attachment — enabled"),
          h("div", { style: S.hint }, "No input needed"),
        ),
        selected.includes("list") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, "Mailing list ID"),
          h("input", { style: S.input, value: vals.list||"", onChange: e => setVal("list", e.target.value), placeholder: "list.example.com" }),
          h("div", { style: S.hint }, "From List-Unsubscribe header"),
        ),
        selected.includes("size") && h("div", { style: S.fieldBlock },
          h("div", { style: S.fieldLabel }, "Size"),
          h("div", { style: { display: 'flex', gap: 6 } },
            h("select", { style: { ...S.input, flex: '0 0 140px' }, value: vals.sizeOp||"", onChange: e => setVal("sizeOp", e.target.value) },
              h("option", { value: "" }, "choose..."),
              h("option", { value: "larger" }, "larger than"),

function parseXmlFilters(xmlString) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "application/xml");
    const parseErr = doc.querySelector("parsererror");
    if (parseErr) return { filters: [], count: 0, error: "XML parse error — make sure you copied the full file." };
    const entries = Array.from(doc.getElementsByTagName("entry"));
    const filters = [];
    entries.forEach((entry, i) => {
      const props = Array.from(entry.childNodes).filter(n => n.nodeType === 1 && n.localName === "property");
      const getVal = (name) => {
        const el = props.find(p => p.getAttribute("name") === name);
        return el ? el.getAttribute("value") : null;
      };
      const criteria = [
        getVal("from") && `from: ${getVal("from")}`,
        getVal("to") && `to: ${getVal("to")}`,
        getVal("subject") && `subject: ${getVal("subject")}`,
        getVal("hasTheWord") && `hasTheWords: ${getVal("hasTheWord")}`,
        getVal("doesNotHaveTheWord") && `doesNotHave: ${getVal("doesNotHaveTheWord")}`,
        getVal("hasAttachment") === "true" && `hasAttachment: true`,
      ].filter(Boolean).join(" | ");
      const actions = [
        getVal("label") && `addLabel: ${getVal("label")}`,
        getVal("shouldArchive") === "true" && "skipInbox",
        getVal("shouldMarkAsRead") === "true" && "markRead",
        getVal("shouldTrash") === "true" && "delete",
        getVal("shouldStar") === "true" && "star",
        getVal("forwardTo") && `forward: ${getVal("forwardTo")}`,
        getVal("shouldNeverSpam") === "true" && "neverSpam",
        getVal("shouldAlwaysMarkAsImportant") === "true" && "markImportant",
        getVal("shouldNeverMarkAsImportant") === "true" && "neverImportant",
      ].filter(Boolean).join(" | ");
      if (criteria || actions) {
        filters.push(`Filter ${i+1}: [${criteria || "no criteria"}] => [${actions || "no actions"}]`);
      }
    });
    return { filters, count: filters.length, error: null };
  } catch (e) {
    return { filters: [], count: 0, error: "Could not parse XML. Make sure you pasted the full exported file." };
  }
}

    rec && h("div", { style: { fontSize: 11, color: "var(--ink-dim)", lineHeight: 1.6, marginBottom: 12, borderLeft: "2px solid var(--line-bright)", paddingLeft: 10 } }, rec.rationale),
    h("div", { style: { marginBottom: 10 } },
      h("div", { style: { fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.15em", color: "var(--ink-faint)", marginBottom: 6 } }, "Filters being merged"),
      ...group.filters.map(f =>
        h("div", { key: f.id, style: { fontSize: 11, color: "var(--ink-dim)", padding: "4px 0", borderBottom: "1px solid var(--line)", lineHeight: 1.6 } },
          h("span", { style: { color: "var(--ink-faint)", fontWeight: 700, marginRight: 8, fontFamily: "monospace" } }, `#${f.id}`),
          f.from && h("span", { style: { color: "var(--teal)" } }, `from: ${f.from.slice(0, 55)}${f.from.length > 55 ? "…" : ""}  `),
          f.subject && h("span", { style: { color: "var(--orange)" } }, `subject: ${f.subject.slice(0, 55)}${f.subject.length > 55 ? "…" : ""}  `),
          f.hasTheWord && h("span", { style: { color: "var(--amber)" } }, `has: ${f.hasTheWord.slice(0, 55)}${f.hasTheWord.length > 55 ? "…" : ""}`),
        )
      ),
    ),
    query && h("div", null,
      h("div", { style: { fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.15em", color: "var(--sand)", marginBottom: 6 } }, "Consolidated criteria query"),
      h("div", { style: { background: "var(--bg-3)", border: "1px solid var(--line-bright)", padding: "10px 12px", fontSize: 11, fontFamily: "monospace", color: "var(--good)", wordBreak: "break-all", lineHeight: 1.6, marginBottom: 8 } }, query),
      h("div", { style: { fontSize: 10, color: "var(--ink-faint)", marginBottom: 8, lineHeight: 1.5 } },
        "Paste into Gmail search bar → click filter icon → Create filter → apply the recommended actions above → Create filter. Then delete the " + group.filters.length + " old filters."
      ),
      h("button", { style: { ...S.btnTeal, padding: "6px 14px", fontSize: 10 }, onClick: doCopy }, queryCopied ? "Copied" : "Copy query"),
    ),
  );
}

// Unlabeled filters grouped by shared sender domain
function UnlabeledCluster({ domain, filters, buildConsolidatedQuery }) {
  const [queryCopied, setQueryCopied] = useState(false);
  const suggestedLabel = domainToLabel(domain);
  const query = buildConsolidatedQuery({ filters });
  const doCopy = () => { navigator.clipboard.writeText(query); setQueryCopied(true); setTimeout(() => setQueryCopied(false), 1500); };

  return h("div", { style: { marginBottom: 20, borderLeft: "2px solid var(--line-bright)", paddingLeft: 16, paddingBottom: 4 } },
    h("div", { style: { display: "flex", alignItems: "baseline", gap: 10, marginBottom: 8 } },
      h("div", { style: { fontSize: 12, fontWeight: 700, color: "var(--ink-dim)", fontFamily: "'Archivo Black', sans-serif" } }, domain),
      h("span", { style: { fontSize: 9, color: "var(--ink-faint)", textTransform: "uppercase", letterSpacing: "0.1em" } },
        `${filters.length} filters · suggested label: `
      ),
      h("span", { style: { fontSize: 9, color: "var(--amber)", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700 } }, suggestedLabel),
    ),
    ...filters.map(f =>
      h("div", { key: f.id, style: { fontSize: 11, color: "var(--ink-dim)", padding: "4px 0", borderBottom: "1px solid var(--line)", lineHeight: 1.6 } },
        h("span", { style: { color: "var(--ink-faint)", fontWeight: 700, marginRight: 8, fontFamily: "monospace" } }, `#${f.id}`),
        f.from && h("span", { style: { color: "var(--teal)" } }, `from: ${f.from.slice(0, 55)}${f.from.length > 55 ? "…" : ""}  `),
        f.subject && h("span", { style: { color: "var(--orange)" } }, `subject: ${f.subject.slice(0, 55)}${f.subject.length > 55 ? "…" : ""}  `),
        f.hasTheWord && h("span", { style: { color: "var(--amber)" } }, `has: ${f.hasTheWord.slice(0, 55)}${f.hasTheWord.length > 55 ? "…" : ""}`),
      )
    ),
    query && h("div", { style: { marginTop: 10 } },
      h("div", { style: { fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.15em", color: "var(--sand)", marginBottom: 6 } }, "Combined query"),
      h("div", { style: { background: "var(--bg-3)", border: "1px solid var(--line-bright)", padding: "10px 12px", fontSize: 11, fontFamily: "monospace", color: "var(--good)", wordBreak: "break-all", lineHeight: 1.6, marginBottom: 8 } }, query),
      h("div", { style: { fontSize: 10, color: "var(--ink-faint)", marginBottom: 8, lineHeight: 1.5 } },
        `Create a new "${suggestedLabel}" label → paste query into Gmail search bar → Create filter → apply your preferred actions.`
      ),
      h("button", { style: { ...S.btnTeal, padding: "6px 14px", fontSize: 10 }, onClick: doCopy }, queryCopied ? "Copied" : "Copy query"),
    ),
  );
}

function MapTab({ filtersRaw, isMobile, isWide }) {
  const [xmlInput, setXmlInput] = useState("");
  const [parsedXml, setParsedXml] = useState(null);
  const [parseError, setParseError] = useState("");
  const [view, setView] = useState("coverage");

  const filters = useMemo(() => {
    if (filtersRaw && filtersRaw.length > 0) {
      return filtersRaw.map((f, i) => {
        const c = f.criteria || {};
        const a = f.action || {};
        return {
          id: i + 1,
          from: c.from || null,
          to: c.to || null,
          subject: c.subject || null,
          hasTheWord: c.query || null,
          doesNotHave: c.negatedQuery || null,
          hasAttachment: c.hasAttachment || false,
          label: a.addLabelIds?.filter(l => !["INBOX","UNREAD","STARRED","IMPORTANT"].includes(l)).join(", ") || null,
          skipInbox: a.removeLabelIds?.includes("INBOX") || false,
          markRead: a.removeLabelIds?.includes("UNREAD") || false,
          star: a.addLabelIds?.includes("STARRED") || false,
          trash: a.addLabelIds?.includes("TRASH") || false,
          markImportant: a.addLabelIds?.includes("IMPORTANT") || false,
          neverImportant: a.removeLabelIds?.includes("IMPORTANT") || false,
          neverSpam: a.addLabelIds?.includes("SPAM") === false && (f.action?.neverSpam || false),
        };
      });
    }
    return parsedXml ? parsedXml.raw : [];
  }, [filtersRaw, parsedXml]);

  const source = filtersRaw?.length > 0 ? "live" : parsedXml ? "xml" : null;

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => parseAndSet(ev.target.result);
    reader.readAsText(file);
  };

  const parseAndSet = (xmlString) => {
    try {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlString, "application/xml");
      if (doc.querySelector("parsererror")) { setParseError("XML parse error."); return; }
      const entries = Array.from(doc.getElementsByTagName("entry"));
      const raw = entries.map((entry, i) => {
        const props = Array.from(entry.childNodes).filter(n => n.nodeType === 1 && n.localName === "property");
        const getVal = (name) => { const el = props.find(p => p.getAttribute("name") === name); return el ? el.getAttribute("value") : null; };
        return {
          id: i + 1,
          from: getVal("from"),
          to: getVal("to"),
          subject: getVal("subject"),
          hasTheWord: getVal("hasTheWord"),
          doesNotHave: getVal("doesNotHaveTheWord"),
          hasAttachment: getVal("hasAttachment") === "true",
          label: getVal("label"),
          skipInbox: getVal("shouldArchive") === "true",
          markRead: getVal("shouldMarkAsRead") === "true",
          star: getVal("shouldStar") === "true",
          trash: getVal("shouldTrash") === "true",
          markImportant: getVal("shouldAlwaysMarkAsImportant") === "true",
          neverImportant: getVal("shouldNeverMarkAsImportant") === "true",
          neverSpam: getVal("shouldNeverSpam") === "true",
        };
      }).filter(f => f.from || f.to || f.subject || f.hasTheWord);
      if (!raw.length) { setParseError("No filters found."); return; }
      setParseError("");
      setParsedXml({ raw, count: raw.length });
    } catch { setParseError("Could not parse XML."); }
  };

  const labelMap = useMemo(() => {
    const m = {};
    filters.forEach(f => {
      const lbl = f.label || "(no label)";
      if (!m[lbl]) m[lbl] = [];
      m[lbl].push(f);
    });
    return m;
  }, [filters]);

  const actionCounts = useMemo(() => {
    const c = { skipInbox: 0, markRead: 0, star: 0, trash: 0, markImportant: 0, neverSpam: 0, neverImportant: 0 };
    filters.forEach(f => { Object.keys(c).forEach(k => { if (f[k]) c[k]++; }); });
    return c;
  }, [filters]);

  const criteriaTypes = useMemo(() => {
    const c = { from: 0, subject: 0, hasTheWord: 0, to: 0, hasAttachment: 0 };
    filters.forEach(f => { Object.keys(c).forEach(k => { if (f[k]) c[k]++; }); });
    return c;
  }, [filters]);

  const overlaps = useMemo(() => {
    const domainMap = {};
    filters.forEach(f => {
      if (!f.from) return;
      const domains = f.from.match(/[\w.-]+\.[\w]{2,}/g) || [];
      domains.forEach(d => {
        if (!domainMap[d]) domainMap[d] = [];
        domainMap[d].push(f.id);
      });
    });
    return Object.entries(domainMap).filter(([, ids]) => ids.length > 1);
  }, [filters]);

  // Only consolidate filters that have a label — unlabeled filters don't share intent
  const consolidations = useMemo(() => {
    const groups = {};
    filters.forEach(f => {
      if (!f.label) return; // skip unlabeled
      const key = f.label;
      if (!groups[key]) {
        const rec = LABEL_RECOMMENDATIONS[f.label];
        groups[key] = {
          filters: [],
          label: f.label,
          normalizedActions: rec ? rec.actions : { skipInbox: false, markRead: false, star: false, trash: false, markImportant: false, neverImportant: false, neverSpam: false },
        };
      }
      groups[key].filters.push(f);
      if (!LABEL_RECOMMENDATIONS[f.label]) {
        const a = groups[key].normalizedActions;
        if (f.skipInbox) a.skipInbox = true;
        if (f.markRead) a.markRead = true;
        if (f.star) a.star = true;
        if (f.trash) a.trash = true;
        if (f.markImportant) a.markImportant = true;
        if (f.neverImportant) a.neverImportant = true;
        if (f.neverSpam) a.neverSpam = true;
      }
    });
    return Object.values(groups).filter(g => g.filters.length > 1).sort((a, b) => {
      const aRec = LABEL_RECOMMENDATIONS[a.label] ? 1 : 0;
      const bRec = LABEL_RECOMMENDATIONS[b.label] ? 1 : 0;
      if (bRec !== aRec) return bRec - aRec;
      return b.filters.length - a.filters.length;
    });
  }, [filters]);

  // Group unlabeled filters by shared root sender domain
  const unlabeledClusters = useMemo(() => {
    const unlabeled = filters.filter(f => !f.label);
    const domainMap = {};
    unlabeled.forEach(f => {
      const domain = extractDomain(f.from);
      if (!domain) return;
      if (!domainMap[domain]) domainMap[domain] = [];
      domainMap[domain].push(f);
    });
    return Object.entries(domainMap)
      .filter(([, fs]) => fs.length > 1)
      .sort((a, b) => b[1].length - a[1].length);
  }, [filters]);

  const buildConsolidatedQuery = (group) => {
    const parts = [];
    const fs = group.filters;
    const froms = fs.flatMap(f => f.from ? [f.from] : []);
    const subjects = fs.flatMap(f => f.subject ? [f.subject] : []);
    const hasWords = fs.flatMap(f => f.hasTheWord ? [f.hasTheWord] : []);
    if (froms.length === 1) parts.push("from:(" + froms[0] + ")");
    else if (froms.length > 1) parts.push("{" + froms.map(v => "from:(" + v + ")").join(" ") + "}");
    if (subjects.length === 1) parts.push("subject:(" + subjects[0] + ")");
    else if (subjects.length > 1) parts.push("{" + subjects.map(v => "subject:(" + v + ")").join(" ") + "}");
    if (hasWords.length === 1) parts.push("(" + hasWords[0] + ")");
    else if (hasWords.length > 1) parts.push("{" + hasWords.map(v => "(" + v + ")").join(" ") + "}");
    if (parts.length > 1) return "(" + parts.join(" OR ") + ")";
    return parts[0] || "";
  };

  const CRITERIA_COLS = ["from","subject","hasTheWord","to","hasAttachment"];
  const ACTION_COLS = ["label","skipInbox","markRead","star","trash","markImportant"];

  const cellStyle = (filled, color) => ({
    padding: "6px 8px", fontSize: 10, textAlign: "center", borderBottom: "1px solid var(--line)",
    borderRight: "1px solid var(--line)", background: filled ? color : "transparent",
    color: filled ? "var(--bg)" : "var(--ink-faint)", fontWeight: filled ? 700 : 400,
    maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
  });

  const thStyle = { padding: "6px 8px", fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.12em", color: "var(--ink-dim)", borderBottom: "1px solid var(--line-bright)", borderRight: "1px solid var(--line)", textAlign: "center", background: "var(--bg-3)" };
  const trStyle = (i) => ({ background: i % 2 === 0 ? "var(--bg-2)" : "var(--bg-3)" });

  const CRITERION_COLORS = { from: "#1E5663", subject: "#FF4A14", hasTheWord: "#F28C00", to: "#4a6340", hasAttachment: "#6b5a3e" };
  const ACTION_COLORS = { label: "#1E5663", skipInbox: "#FF4A14", markRead: "#8a8270", star: "#F28C00", trash: "#d63c3c", markImportant: "#7fb86b" };

  const truncate = (s, n=28) => s ? (s.length > n ? s.slice(0, n) + "…" : s) : "";

  if (!source) {
    return h("div", null,
      h("div", { style: { ...S.warningBox, borderColor: "var(--teal)", color: "var(--ink-dim)", marginBottom: 20 } },
        "Sign in with Google for live filters, or upload your exported XML below to visualize your filter setup."
      ),
      h("div", { style: S.fieldBlock },
        h("div", { style: S.fieldLabel }, "Upload filter XML"),
        h("input", { type: "file", accept: ".xml,text/xml", style: { ...S.input, padding: "10px 14px", cursor: "pointer", color: "var(--ink-dim)", fontSize: 11 }, onChange: handleFileUpload }),
      ),
      h("div", { style: { ...S.hint, marginBottom: 12, textAlign: "center" } }, "— or paste directly —"),
      h("textarea", { style: { ...S.textarea, minHeight: 100, fontSize: 11 }, value: xmlInput, onChange: e => setXmlInput(e.target.value), placeholder: "Paste exported XML here" }),
      parseError && h("div", { style: { ...S.warningBox, marginTop: 8 } }, parseError),
      h("button", { style: xmlInput.trim() ? S.btnPrimary : S.btnPrimaryDisabled, onClick: () => xmlInput.trim() && parseAndSet(xmlInput), disabled: !xmlInput.trim() }, "Load filters"),
    );
  }

  const unlabeledCount = filters.filter(f => !f.label).length;

  return h("div", null,
    h("div", { style: S.statRow },
      h("div", { style: S.statCell }, h("div", { style: S.statNum }, filters.length), h("div", { style: S.statLabel }, "Filters")),
      h("div", { style: S.statDivider }),
      h("div", { style: S.statCell }, h("div", { style: S.statNum }, Object.keys(labelMap).length), h("div", { style: S.statLabel }, "Labels")),
      h("div", { style: S.statDivider }),
      h("div", { style: S.statCell }, h("div", { style: S.statNum }, consolidations.length), h("div", { style: S.statLabel }, "Can merge")),
      h("div", { style: S.statDivider }),
      h("div", { style: S.statCell }, h("div", { style: S.statNum }, source === "live" ? "Live" : "XML"), h("div", { style: S.statLabel }, "Source")),
    ),

    h("div", { style: { display: "flex", gap: 6, marginBottom: 20, flexWrap: "wrap" } },
      ["coverage","labels","actions","overlaps","consolidate"].map(v =>
        h("button", { key: v, style: view === v ? { ...S.btnTeal, borderColor: "var(--orange)", color: "var(--orange)" } : S.btnSecondary, onClick: () => setView(v) },
          v === "coverage" ? "Coverage matrix" : v === "labels" ? "Label map" : v === "actions" ? "Action breakdown" : v === "overlaps" ? "Overlaps" : "Consolidations"
        )
      )
    ),

    // ── COVERAGE MATRIX ──
    view === "coverage" && h("div", null,
      h("div", { style: { ...S.instrTitle, marginBottom: 12 } }, "Coverage matrix — criteria vs actions per filter"),
      h("div", { style: { overflowX: "auto" } },
        h("table", { style: { borderCollapse: "collapse", width: "100%", fontSize: 11 } },
          h("thead", null,
            h("tr", null,
              h("th", { style: { ...thStyle, textAlign: "left", minWidth: 40 } }, "#"),
              ...CRITERIA_COLS.map(c => h("th", { key: c, style: thStyle }, c === "hasTheWord" ? "has words" : c === "hasAttachment" ? "attach" : c)),
              h("th", { style: { ...thStyle, background: "var(--bg-2)" } }, ""),
              ...ACTION_COLS.map(a => h("th", { key: a, style: { ...thStyle, background: "var(--bg-2)" } }, a === "skipInbox" ? "archive" : a === "markRead" ? "read" : a === "markImportant" ? "important" : a)),
            )
          ),
          h("tbody", null,
            filters.map((f, i) =>
              h("tr", { key: f.id, style: trStyle(i) },
                h("td", { style: { ...cellStyle(false), textAlign: "left", color: "var(--ink-dim)", fontWeight: 700, minWidth: 30 } }, f.id),
                ...CRITERIA_COLS.map(c => {
                  const val = f[c];
                  const filled = c === "hasAttachment" ? val : !!val;
                  return h("td", { key: c, style: cellStyle(filled, CRITERION_COLORS[c] || "var(--teal)"), title: typeof val === "string" ? val : "" },
                    filled ? (c === "hasAttachment" ? "✓" : truncate(val, 18)) : "·"
                  );
                }),
                h("td", { style: { ...cellStyle(false), borderLeft: "2px solid var(--line-bright)" } }, ""),
                ...ACTION_COLS.map(a => {
                  const val = f[a];
                  const filled = a === "label" ? !!val : !!val;
                  return h("td", { key: a, style: cellStyle(filled, ACTION_COLORS[a] || "var(--orange)"), title: typeof val === "string" ? val : "" },
                    filled ? (a === "label" ? truncate(val, 14) : "✓") : "·"
                  );
                }),
              )
            )
          )
        )
      ),
      h("div", { style: { ...S.hint, marginTop: 10 } }, "Teal = from / subject / has words. Orange = archive / trash. Hover cells to see full values."),
    ),

    // ── LABEL MAP ──
    view === "labels" && h("div", null,
      h("div", { style: { ...S.instrTitle, marginBottom: 12 } }, "Filters grouped by destination label"),
      Object.entries(labelMap).sort((a,b) => b[1].length - a[1].length).map(([label, lfilters]) =>
        h("div", { key: label, style: { ...S.fieldBlock, borderLeft: "2px solid var(--teal)", paddingLeft: 14, marginBottom: 16 } },
          h("div", { style: { ...S.fieldLabel, marginBottom: 6 } },
            h("span", { style: { color: "var(--sand)" } }, label),
            h("span", { style: { fontSize: 10, color: "var(--ink-faint)", fontWeight: 400 } }, ` ${lfilters.length} filter${lfilters.length !== 1 ? "s" : ""}`),
          ),
          ...lfilters.map(f =>
            h("div", { key: f.id, style: { fontSize: 11, color: "var(--ink-dim)", padding: "4px 0", borderBottom: "1px solid var(--line)", lineHeight: 1.5 } },
              h("span", { style: { color: "var(--ink-faint)", marginRight: 8, fontWeight: 700 } }, `#${f.id}`),
              f.from && h("span", null, `from: ${truncate(f.from, 40)}  `),
              f.subject && h("span", null, `subject: ${truncate(f.subject, 40)}  `),
              f.hasTheWord && h("span", null, `has: ${truncate(f.hasTheWord, 40)}`),
            )
          )
        )
      )
    ),

    // ── ACTION BREAKDOWN ──
    view === "actions" && h("div", null,
      h("div", { style: { ...S.instrTitle, marginBottom: 12 } }, "How many filters trigger each action"),
      h("div", { style: { marginBottom: 20 } },
        Object.entries(actionCounts).map(([action, count]) => {
          const pct = Math.round((count / filters.length) * 100);
          const color = ACTION_COLORS[action] || "var(--teal)";
          return h("div", { key: action, style: { marginBottom: 12 } },
            h("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: 4 } },
              h("span", { style: { fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: "var(--ink-dim)" } }, action),
              h("span", { style: { fontSize: 11, color: "var(--ink-faint)" } }, `${count} / ${filters.length}`),
            ),
            h("div", { style: { height: 8, background: "var(--bg-3)", border: "1px solid var(--line-bright)" } },
              h("div", { style: { height: "100%", width: `${pct}%`, background: color, transition: "width 0.3s" } })
            ),
          );
        })
      ),
      h("div", { style: { ...S.instrTitle, marginBottom: 12 } }, "Criteria type breakdown"),
      Object.entries(criteriaTypes).map(([crit, count]) => {
        const pct = Math.round((count / filters.length) * 100);
        const color = CRITERION_COLORS[crit] || "var(--teal)";
        return h("div", { key: crit, style: { marginBottom: 12 } },
          h("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: 4 } },
            h("span", { style: { fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: "var(--ink-dim)" } }, crit),
            h("span", { style: { fontSize: 11, color: "var(--ink-faint)" } }, `${count} / ${filters.length}`),
          ),
          h("div", { style: { height: 8, background: "var(--bg-3)", border: "1px solid var(--line-bright)" } },
            h("div", { style: { height: "100%", width: `${pct}%`, background: color, transition: "width 0.3s" } })
          ),
        );
      })
    ),

    // ── OVERLAPS ──
    view === "overlaps" && h("div", null,
      h("div", { style: { ...S.instrTitle, marginBottom: 12 } }, `${overlaps.length} domain${overlaps.length !== 1 ? "s" : ""} matched by multiple filters`),
      overlaps.length === 0
        ? h("div", { style: { color: "var(--ink-dim)", fontSize: 12, padding: "12px 0" } }, "No domain overlaps detected.")
        : overlaps.map(([domain, ids]) =>
            h("div", { key: domain, style: { marginBottom: 12, borderLeft: "2px solid var(--amber)", paddingLeft: 14 } },
              h("div", { style: { fontSize: 12, fontWeight: 700, color: "var(--amber)", marginBottom: 4 } }, domain),
              h("div", { style: { fontSize: 11, color: "var(--ink-dim)" } }, `Matched by filter${ids.length !== 1 ? "s" : ""}: ${ids.join(", ")}`),
              ...ids.map(id => {
                const f = filters.find(x => x.id === id);
                if (!f) return null;
                return h("div", { key: id, style: { fontSize: 10, color: "var(--ink-faint)", marginTop: 4, paddingLeft: 8 } },
                  `#${id}: `,
                  f.label && `label→${f.label}  `,
                  f.skipInbox && "archive  ",
                  f.trash && "trash  ",
                  f.markRead && "markRead",
                );
              })
            )
          )
    ),

    // ── CONSOLIDATIONS ──
    view === "consolidate" && h("div", null,

      // Labeled consolidations
      h("div", { style: { ...S.instrTitle, marginBottom: 4 } },
        `${consolidations.length} labeled consolidation${consolidations.length !== 1 ? "s" : ""}`
      ),
      h("div", { style: { ...S.hint, marginBottom: consolidations.length ? 20 : 8 } },
        "Groups of filters sharing the same label that can each be collapsed into one filter."
      ),
      consolidations.length === 0
        ? h("div", { style: { color: "var(--ink-dim)", fontSize: 12, padding: "8px 0 20px" } }, "No labeled consolidation opportunities.")
        : consolidations.map((group, gi) =>
            h(ConsolidationGroup, { key: gi, group, buildConsolidatedQuery })
          ),

      // Divider
      h("div", { style: { borderTop: "1px solid var(--line-bright)", margin: "24px 0 20px" } }),

      // Unlabeled domain clusters
      h("div", { style: { ...S.instrTitle, marginBottom: 4 } },
        `${unlabeledClusters.length} unlabeled cluster${unlabeledClusters.length !== 1 ? "s" : ""} by sender domain`
      ),
      unlabeledCount > 0 && h("div", { style: { ...S.hint, marginBottom: 16 } },
        `${unlabeledCount} of your filters have no label. The groups below share a sender domain — consider creating a label for each and consolidating.`
      ),
      unlabeledClusters.length === 0
        ? h("div", { style: { color: "var(--ink-dim)", fontSize: 12, padding: "8px 0" } },
            unlabeledCount === 0
              ? "All filters have labels — nothing to cluster."
              : "No unlabeled filters share a sender domain."
          )
        : unlabeledClusters.map(([domain, clusterFilters]) =>
            h(UnlabeledCluster, { key: domain, domain, filters: clusterFilters, buildConsolidatedQuery })
          ),
    ),
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("build");
  const auth = useGoogleAuth();
  const { isMobile, isWide } = useViewport();

  return h("div", { style: S.wrap(isWide) },
    h("div", { style: S.header },
      h("div", { style: S.headerTop },
        h("div", null,
          h("div", { style: S.title(isWide) }, "GMAIL FILTER TRIAGE"),
          h("div", { style: S.subtitle }, "// SEARCH QUERY CONSTRUCTOR"),
        ),
        h("div", { style: S.meta },
          h("div", null, "FORM REV. 10"),
          h("div", null, revDate),
        ),
      ),
      h("div", { style: S.accentStrip }),
    ),
    h("div", { style: S.authBar },
      h("div", null,
        h("div", { style: S.authStatus(!!auth.token) }, auth.token ? "Connected" : "Not signed in"),
        auth.userEmail && h("div", { style: S.authMeta }, auth.userEmail),
        auth.token && h("div", { style: S.authMeta }, auth.filterCount + " filters loaded"),
      ),
      auth.token
        ? h("button", { style: S.btnSecondary, onClick: auth.signOut }, "Sign out")
        : h("button", { style: { ...S.btnTeal, marginTop: 0 }, onClick: auth.signIn, disabled: auth.loading }, auth.loading ? "Signing in..." : "Sign in with Google"),
    ),
    h("div", { style: { ...S.tabRow, overflowX: isMobile ? 'auto' : 'visible' }, className: 'tab-row-scroll' },
      h("button", { style: S.tab(tab === "build"), onClick: () => setTab("build") }, "Build filter"),
      h("button", { style: S.tab(tab === "diagnose"), onClick: () => setTab("diagnose") }, "Diagnose (live)"),
      h("button", { style: S.tab(tab === "xml"), onClick: () => setTab("xml") }, "Diagnose (XML)"),
      h("button", { style: S.tab(tab === "map"), onClick: () => setTab("map") }, "Filter map"),
    ),
    tab === "build" && h(BuildTab, { isMobile, isWide }),
    tab === "diagnose" && h(DiagnoseTab, { filtersRaw: auth.filtersRaw, filterCount: auth.filterCount, token: auth.token, refresh: auth.refresh, isMobile }),
    tab === "xml" && h(XmlTab, { isMobile }),
    tab === "map" && h(MapTab, { filtersRaw: auth.filtersRaw, isMobile, isWide }),
  );
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
